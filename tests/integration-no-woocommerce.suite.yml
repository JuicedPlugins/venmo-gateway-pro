# Codeception Test Suite Configuration
#
# The integration tests, without WooCommerce: `codecept run integration-no-woocommerce`.

path: integration
actor: WpunitTester
modules:
    enabled:
        - lucatume\WPBrowser\Module\WPLoader
        - \Helper\Wpunit
    config:
        lucatume\WPBrowser\Module\WPLoader:
            loadOnly: false
            wpRootFolder: "%WP_ROOT_FOLDER%"
            dbUrl: 'mysql://%TEST_DB_USER%:%TEST_DB_PASSWORD%@%TEST_DB_HOST%:%TEST_DB_PORT%/%TEST_DB_NAME%'
            tablePrefix: "%TEST_TABLE_PREFIX%"
            domain: "%TEST_SITE_WP_DOMAIN%"
            adminEmail: "%TEST_SITE_ADMIN_EMAIL%"
            title: "juiced-venmo-gateway-pro"
            plugins: ["juiced-venmo-gateway-pro.php"]
            activatePlugins: []
            WP_CONTENT_DIR: wp-content
bootstrap: _bootstrap.php
